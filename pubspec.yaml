name: rawnq
description: "RAWNQ (رونق) — تطبيق التسوق لمتجر رونق للملابس النسائية في غزة."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^18.0.0

  # Networking
  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  # Images
  cached_network_image: ^4.0.0

  # Local persistence
  shared_preferences: ^2.5.5

  # Platform integrations
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

  # Localisation / formatting
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/data/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/brand/rawnq_logo.jpg"
  adaptive_icon_background: "#F3EBE1"
  adaptive_icon_foreground: "assets/brand/rawnq_logo.jpg"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F3EBE1"
  image: assets/brand/rawnq_logo.jpg
  android_12:
    color: "#F3EBE1"
    image: assets/brand/rawnq_logo.jpg
  android: true
  ios: true
